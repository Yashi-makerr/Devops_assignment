name: Build and Push Docker Images

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Backend Image
        run: docker build -t yashikesarwani/mean-backend:latest ./backend

      - name: Build Angular App
        run: |
          cd frontend
          npm install
          npm run build -- --configuration production

      - name: Build Frontend Image
        run: docker build -t yashikesarwani/mean-frontend:latest ./frontend

      - name: Build Nginx Image
        run: docker build -t yashikesarwani/mean-nginx:latest -f nginx.Dockerfile .

      - name: Push Backend Image
        run: docker push yashikesarwani/mean-backend:latest

      - name: Push Frontend Image
        run: docker push yashikesarwani/mean-frontend:latest

      - name: Push Nginx Image
        run: docker push yashikesarwani/mean-nginx:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Azure VM
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.AZURE_HOST }}
          username: ${{ secrets.AZURE_USER }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          script: |
            cd /home/azureuser/mean-app
            docker compose pull
            docker compose up -d